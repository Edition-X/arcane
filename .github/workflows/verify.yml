name: Verify artifact

# Installs a built Arcane the way a stranger would and drives it over MCP
# stdio. Nothing in this workflow runs the test suite or imports the checkout:
# a pass means the artifact works, not that the source tree does.
#
# Called twice per release — once against the wheel before anything is
# published, and once against PyPI and the container image afterwards — and
# weekly against whatever is currently published.

on:
  workflow_call:
    inputs:
      source:
        description: wheel (from a run artifact) or pypi (from the index).
        required: true
        type: string
      version:
        description: Version under test. Required for the pypi source.
        required: false
        type: string
        default: ""
      artifact:
        description: Name of the run artifact holding dist/, for the wheel source.
        required: false
        type: string
        default: dist
      image:
        description: Container image to exercise as well. Empty to skip.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  install:
    name: ${{ inputs.source }} · ${{ matrix.os }} · py${{ matrix.python }} · ${{ matrix.installer }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
        installer: [uv]
        # Plenty of people will reach for pip, so one leg proves that path too.
        include:
          - os: ubuntu-latest
            python: "3.13"
            installer: pip
    steps:
      # Only the verification script. The package under test comes from the
      # index or the artifact, never from this checkout.
      - name: Checkout the verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/verify_release.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Download the built distribution
        if: inputs.source == 'wheel'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: dist

      - name: Install and exercise
        shell: bash
        env:
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ inputs.version }}
          PYTHON: ${{ matrix.python }}
          INSTALLER: ${{ matrix.installer }}
        run: |
          set -euo pipefail
          args=(--python "$PYTHON" --installer "$INSTALLER")
          if [ -n "$VERSION" ]; then
            args+=(--version "$VERSION")
          fi
          if [ "$SOURCE" = "wheel" ]; then
            wheel=$(find dist -name '*.whl' | head -1)
            test -n "$wheel"
            args+=(--target wheel --wheel "$wheel")
          else
            args+=(--target pypi)
          fi
          uv run --no-project --with "mcp>=2.3,<3" python scripts/verify_release.py "${args[@]}"

  container:
    name: container image
    if: inputs.image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/verify_release.py
          sparse-checkout-cone-mode: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Pull and exercise the image
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          args=(--target docker --image "$IMAGE")
          if [ -n "$VERSION" ]; then
            args+=(--version "$VERSION")
          fi
          uv run --no-project --with "mcp>=2.3,<3" python scripts/verify_release.py "${args[@]}"
