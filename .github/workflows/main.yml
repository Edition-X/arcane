name: Main

# Proves every commit on main is releasable without releasing it.
#
# Merging no longer cuts a version. This builds the distribution once and puts
# it through the same install-and-drive verification a real release gets, so by
# the time someone runs the Release workflow the only new thing it does is
# publish. Nothing here is permanent: no tag, no PyPI upload, no GitHub release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Verification is advisory and the newest commit supersedes the one before
  # it, so a superseded run is cancelled. The Release workflow has its own
  # group and is never cancelled.
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives the version from tags, so the whole history is
          # needed for the build to be stamped with anything meaningful.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup
        with:
          extras: none
          cache: "false"

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      - name: Record what was built
        run: |
          {
            echo "### Built from ${GITHUB_SHA:0:7}"
            echo
            echo '```'
            ls -1 dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  verify:
    name: Verify
    needs: build
    uses: ./.github/workflows/verify.yml
    with:
      source: wheel

  image:
    name: Rolling image
    needs: verify
    # Forks have no package registry to push to and no reason to try.
    if: github.repository == 'Edition-X/arcane'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ghcr.io/${{ github.repository }}:main
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/edition-x/arcane:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
