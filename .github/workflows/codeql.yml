name: CodeQL

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/codeql.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
  schedule:
    # Weekly, off the hour: a new query pack can find something in code that
    # has not changed since the last scan.
    - cron: '37 5 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Analyse Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@0fda7a646fd14a20daf520829ca1ae8847000819 # codeql-bundle-v2.27.3
        with:
          languages: python
          # Security queries only. ruff and mypy already gate code quality on
          # every pull request; CodeQL's quality rules mostly flagged pytest
          # asserts and Protocol stubs, and alerts nobody acts on teach people
          # to stop reading the Security tab.
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@0fda7a646fd14a20daf520829ca1ae8847000819 # codeql-bundle-v2.27.3
        with:
          category: /language:python
