<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360"
     role="img" aria-label="arcane: Persistent memory for AI coding agents, shared across every project and harness.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7f4"/>
      <stop offset="1" stop-color="#efece5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.18" r="0.62">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#6d28d9" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#1d1c1a" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.42" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="360" fill="url(#fade)"/></mask>
    <clipPath id="frame"><rect width="1200" height="360" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#dots)" mask="url(#m)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <g fill="none" stroke="#6d28d9" stroke-linecap="round">
      <circle cx="1030" cy="400" r="150" stroke-opacity="0.35" stroke-width="1.5"/>
      <circle cx="1030" cy="400" r="215" stroke-opacity="0.22" stroke-width="1.5"/>
      <circle cx="1030" cy="400" r="280" stroke-opacity="0.12" stroke-width="1.5"/>
    </g>
    <rect x="0" y="0" width="6" height="360" fill="#6d28d9" fill-opacity="0.85"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="21.5" fill="none" stroke="#e2ded5"/>
  <text x="84" y="97" font-family="&#x27;SF Mono&#x27;, ui-monospace, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace" font-size="15" letter-spacing="2.4" fill="#6d28d9">MCP SERVER · EDITION-X</text>
  <text x="81" y="184" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="84" font-weight="680" letter-spacing="-1.68" fill="#1d1c1a">arcane</text>
  <text x="84" y="236" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="24" fill="#4b4945">Persistent memory for AI coding agents, shared across every</text>
  <text x="84" y="270" font-family="-apple-system, BlinkMacSystemFont, &#x27;Segoe UI&#x27;, &#x27;Helvetica Neue&#x27;, Helvetica, Arial, sans-serif" font-size="24" fill="#4b4945">project and harness.</text>
</svg>
