name: Change request
description: Something Arcane should do, or should do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What are you trying to do, and where does Arcane get in the way?
        Describe the situation rather than the feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. If you already know the shape of the fix, say so.

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Existing tools or workarounds, and why they fall short.
