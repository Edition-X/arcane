[build-system]
# Pinned: the backend decides what goes in the wheel, so a release must not
# change with whatever version was newest that day.
requires = ["hatchling==1.32.4", "hatch-vcs==0.5.0", "hatch-fancy-pypi-readme==25.1.0"]
build-backend = "hatchling.build"

[project]
name = "arcane-mcp"
dynamic = ["version", "readme"]
description = "Persistent memory for AI coding agents, shared across every project and harness."
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Dan Kelly" }]
keywords = ["agent", "memory", "mcp", "engineering", "knowledge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # Every release is installed and driven over MCP stdio on all three before
    # it is published; see .github/workflows/verify.yml.
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.0",
    "httpx>=0.24",
    "mcp>=2.3,<3",
    "jsonschema>=4.20",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1",
]

[project.urls]
Homepage = "https://github.com/Edition-X/arcane"
Documentation = "https://edition-x.github.io/arcane/"
Source = "https://github.com/Edition-X/arcane"
Changelog = "https://github.com/Edition-X/arcane/releases"
Issues = "https://github.com/Edition-X/arcane/issues"

[project.optional-dependencies]
pysqlite3 = ["pysqlite3-binary>=0.5"]
dev = [
    # Lower bounds the lowest-direct CI job actually resolves to, so they have
    # to be pairs that work: pytest-asyncio 0.23 cannot collect under pytest 9.
    "pytest>=8.2",
    "pytest-asyncio>=1.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.20",
]

[project.scripts]
arcane = "arcane.cli:main"
memory = "arcane.cli:main"

[tool.hatch.version]
source = "vcs"

[project.entry-points."arcane.plugins.ingestion"]
git = "arcane.plugins.builtin.git_ingest:GitIngestionPlugin"
github_actions = "arcane.plugins.builtin.gha_ingest:GHAIngestionPlugin"
linear = "arcane.plugins.builtin.linear_ingest:LinearIngestionPlugin"

[project.entry-points."arcane.plugins.intelligence"]
velocity = "arcane.plugins.builtin.velocity:VelocityTracker"
health = "arcane.plugins.builtin.health_audit:HealthAuditor"
usage = "arcane.plugins.builtin.usage:UsageAnalyzer"

[project.entry-points."arcane.plugins.content"]
blog = "arcane.plugins.builtin.blog_gen:BlogGenerator"
adr = "arcane.plugins.builtin.adr_gen:ADRGenerator"

[tool.hatch.build.targets.wheel]
packages = ["src/arcane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["artifact: builds and tests the installed package artifact"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/arcane/infra/db/schema.py" = ["E501"]  # SQL trigger strings
"src/arcane/mcp_server/tools/memory_tools.py" = ["E501"]  # Long description strings
"tests/integration/test_migration.py" = ["E501"]  # SQL strings
"tests/unit/test_search.py" = ["E402"]  # Import after monkeypatch
"tests/plugins/test_registry.py" = ["E501"]  # Long protocol check lines

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
files = ["src/arcane"]

[[tool.mypy.overrides]]
module = ["sqlite_vec", "mcp.*", "pysqlite3", "pysqlite3.dbapi2"]
ignore_missing_imports = true

# PyPI renders the README without the repository around it, so relative links
# and images would break there. The build rewrites them to absolute GitHub URLs;
# the README in the repository stays relative.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/Edition-X/arcane/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#)([^"]+)"'
replacement = 'href="https://github.com/Edition-X/arcane/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/Edition-X/arcane/blob/main/\1)'
